################
### MONITORS ###
################
monitor=,preferred,auto,auto
env = LANG,en_US.UTF-8
env = LC_ALL,en_US.UTF-8

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$browser = google-chrome-stable
$fileManager = dolphin
$menu = hyprlauncher

#################
### AUTOSTART ###
#################
exec-once = hypridle
exec-once = swww-daemon
exec-once = swww img ~/Wallpapers/Nature/dunes-emiliano-arano.jpg --transition-type none
exec-once = waybar
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = hyprlock

##################
### DARK THEME ###
##################
#for libadwaita gtk4 apps you can use this command:
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#for gtk3 apps you need to install adw-gtk3 theme (in arch linux sudo pacman -S adw-gtk-theme)
exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"   # for GTK3 apps

#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons   
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to win + P in the keybinds section below
    preserve_split = true # You probably want this
    split_width_multiplier = 1.6
    force_split = 0
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}



#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true 
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.2
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

#  Per-device config
device {
    name = ven_2c2f:00-2c2f:002b-touchpad
    sensitivity = 0.15
    accel_profile = adaptive
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$win = SUPER # Sets "Windows" key as main modifier
$hyper = CONTROL_ALT_SHIFT_SUPER
$alt = ALT

bind = $hyper, T, exec, $terminal
bind = $hyper, N, exec, $browser
bind = $hyper, backspace, exec, hyprlock

bind = $win, Q, killactive,
bind = $win, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $win, E, exec, $fileManager
bind = $win, V, togglefloating,
bind = $win, R, exec, $menu
bind = $win, P, pseudo, # dwindle
bind = $win, J, layoutmsg, togglesplit # dwindle

# Move focus with win + arrow keys
bind = $win, left, movefocus, l
bind = $win, right, movefocus, r
bind = $win, up, movefocus, u
bind = $win, down, movefocus, d
bind = $win, h, movefocus, l
bind = $win, l, movefocus, r
bind = $win, k, movefocus, u
bind = $win, j, movefocus, d

# Mouse binds
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# Switch workspaces with win + [0-9]
bind = $win, 1, workspace, 1
bind = $win, 2, workspace, 2
bind = $win, 3, workspace, 3
bind = $win, 4, workspace, 4
bind = $win, 5, workspace, 5
bind = $win, 6, workspace, 6
bind = $win, 7, workspace, 7
bind = $win, 8, workspace, 8
bind = $win, 9, workspace, 9
bind = $win, 0, workspace, 10

# Move active window to a workspace with win + SHIFT + [0-9]
bind = $win SHIFT, 1, movetoworkspace, 1
bind = $win SHIFT, 2, movetoworkspace, 2
bind = $win SHIFT, 3, movetoworkspace, 3
bind = $win SHIFT, 4, movetoworkspace, 4
bind = $win SHIFT, 5, movetoworkspace, 5
bind = $win SHIFT, 6, movetoworkspace, 6
bind = $win SHIFT, 7, movetoworkspace, 7
bind = $win SHIFT, 8, movetoworkspace, 8
bind = $win SHIFT, 9, movetoworkspace, 9
bind = $win SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $win, S, togglespecialworkspace, magic
bind = $win SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with win + scroll
bind = $win, mouse_down, workspace, e+1
bind = $win, mouse_up, workspace, e-1
bind = $hyper, l, workspace, e+1
bind = $hyper, h, workspace, e-1

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.5
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
